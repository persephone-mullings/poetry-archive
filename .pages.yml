content:
  - name: poems
    label: Poems
    type: collection
    path: src/content/poems

    filename: "{title}.md"

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: published
        label: Published
        type: boolean
        default: false

      - name: body
        label: Poem
        type: rich-text
        required: true